<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>ハンドボール得点板</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    body {
      color: white;
    }

    /* =========================
       全体 6 : 2 : 2
       ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-columns: 6fr 2fr 2fr;
    }

    /* =========================
       得点エリア
       ========================= */

    .teams {
      display: flex;
      width: 100%;
      height: 100%;
      direction: ltr;
    }

    /* 後半は左右入れ替え */
    .teams.second-half {
      direction: rtl;
    }

    .team {
      direction: ltr;
      flex: 1;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      touch-action: manipulation;
      cursor: pointer;
    }

    .home {
      background: #064b91;
    }

    .aweY {
      background: #8b1111;
    }

    .team-name {
      font-size: clamp(24px, 4vw, 48px);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .score {
      font-size: clamp(100px, 18vw, 260px);
      line-height: 0.9;
      font-weight: bold;
    }

    /* =========================
       タイマーエリア
       ========================= */

    .timer-area {
      background: #181818;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 10px;
      gap: 14px;
    }

    .period {
      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: bold;
      text-align: center;
    }

    .timer {
      font-size: clamp(45px, 7vw, 100px);
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    /* =========================
       時間設定
       ========================= */

    .settings {
      width: min(90%, 260px);

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .settings-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .setting-label {
      font-size: 13px;
      text-align: center;
      color: #ccc;
    }

    .time-input {
      width: 100%;
      min-width: 0;

      padding: 7px 4px;

      border: 1px solid #555;
      border-radius: 6px;

      background: #292929;
      color: white;

      font-size: 18px;
      text-align: center;
    }

    .settings-button {
      width: 100%;
      margin-top: 4px;

      padding: 9px 6px;

      border: none;
      border-radius: 7px;

      background: #555;
      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;
    }

    .settings-button:active {
      transform: scale(0.97);
    }

    /* =========================
       操作ボタン
       ========================= */

    .controls {
      background: #111;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 14px;
      padding: 10px;
    }

    .control-button {
      width: min(85%, 220px);

      padding: 16px 8px;

      border: none;
      border-radius: 10px;

      background: #333;
      color: white;

      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;
    }

    .control-button:active {
      transform: scale(0.96);
    }

    /* =========================
       スマホ縦画面
       ========================= */

    @media (orientation: portrait) {

      .app {
        grid-template-columns: 6fr 2fr 2fr;
      }

      .team-name {
        font-size: clamp(18px, 5vw, 36px);
      }

      .score {
        font-size: clamp(70px, 22vw, 180px);
      }

      .timer {
        font-size: clamp(36px, 9vw, 70px);
      }

      .settings {
        width: 94%;
      }

      .settings-title {
        font-size: 14px;
      }

      .setting-label {
        font-size: 10px;
      }

      .time-input {
        font-size: 14px;
        padding: 5px 2px;
      }

      .settings-button {
        font-size: 12px;
        padding: 7px 3px;
      }

      .control-button {
        width: 90%;
        padding: 12px 4px;
        font-size: 16px;
      }

      .controls {
        gap: 9px;
      }

      .timer-area {
        gap: 8px;
        padding: 5px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         HOME / AWEY
         ========================= -->

    <div class="teams" id="teams">

      <div
        class="team home"
        id="homeTeam"
      >
        <div class="team-name">HOME</div>
        <div class="score" id="homeScore">0</div>
      </div>

      <div
        class="team aweY"
        id="aweYTeam"
      >
        <div class="team-name">AWEY</div>
        <div class="score" id="aweYScore">0</div>
      </div>

    </div>


    <!-- =========================
         タイマー
         ========================= -->

    <div class="timer-area">

      <div class="period" id="periodDisplay">
        前半
      </div>

      <div class="timer" id="timerDisplay">
        25:00
      </div>


      <!-- =========================
           時間設定
           ========================= -->

      <div class="settings">

        <div class="settings-title">
          時間設定
        </div>

        <div class="setting-row">
          <div class="setting-label">試合 分</div>
          <div class="setting-label">試合 秒</div>
        </div>

        <div class="setting-row">

          <input
            id="minutesInput"
            class="time-input"
            type="number"
            min="0"
            max="99"
            value="25"
          >

          <input
            id="secondsInput"
            class="time-input"
            type="number"
            min="0"
            max="59"
            value="0"
          >

        </div>


        <div class="setting-row">
          <div class="setting-label">ハーフタイム 分</div>
          <div></div>
        </div>

        <div class="setting-row">

          <input
            id="halftimeInput"
            class="time-input"
            type="number"
            min="0"
            max="99"
            value="10"
          >

          <div></div>

        </div>


        <!-- 設定を反映する専用ボタン -->

        <button
          class="settings-button"
          id="applySettingsButton"
        >
          設定を反映
        </button>

      </div>

    </div>


    <!-- =========================
         操作
         ========================= -->

    <div class="controls">

      <button
        class="control-button"
        id="startButton"
      >
        START
      </button>

      <button
        class="control-button"
        id="pauseButton"
      >
        PAUSE
      </button>

      <button
        class="control-button"
        id="resetButton"
      >
        RESET
      </button>

    </div>

  </div>


  <script>

    /* ==================================================
       得点
       ================================================== */

    let homeScore = 0;
    let aweYScore = 0;


    /*
     * ダブルタップ判定用
     *
     * 1回目
     *   ↓
     * 250ms待つ
     *   ↓
     * 2回目が来なければ +1
     *
     * 2回目が来たら -1
     *
     * これにより
     * 「+1してから-1」
     * にならないようにする
     */

    let homeTapTimer = null;
    let aweYTapTimer = null;

    const DOUBLE_TAP_DELAY = 250;


    function updateScores() {

      document.getElementById("homeScore").textContent =
        homeScore;

      document.getElementById("aweYScore").textContent =
        aweYScore;
    }


    function handleScoreTap(team) {

      if (team === "home") {

        /* 2回目のタップ */
        if (homeTapTimer !== null) {

          clearTimeout(homeTapTimer);
          homeTapTimer = null;

          if (homeScore > 0) {
            homeScore--;
          }

          updateScores();
          return;
        }


        /* 1回目のタップ */
        homeTapTimer = setTimeout(() => {

          homeScore++;

          updateScores();

          homeTapTimer = null;

        }, DOUBLE_TAP_DELAY);

        return;
      }


      if (team === "aweY") {

        /* 2回目のタップ */
        if (aweYTapTimer !== null) {

          clearTimeout(aweYTapTimer);
          aweYTapTimer = null;

          if (aweYScore > 0) {
            aweYScore--;
          }

          updateScores();
          return;
        }


        /* 1回目のタップ */
        aweYTapTimer = setTimeout(() => {

          aweYScore++;

          updateScores();

          aweYTapTimer = null;

        }, DOUBLE_TAP_DELAY);

        return;
      }
    }


    /* ==================================================
       タップイベント
       ================================================== */

    document
      .getElementById("homeTeam")
      .addEventListener("pointerup", function(event) {

        event.preventDefault();

        handleScoreTap("home");
      });


    document
      .getElementById("aweYTeam")
      .addEventListener("pointerup", function(event) {

        event.preventDefault();

        handleScoreTap("aweY");
      });


    /* ==================================================
       タイマー
       ================================================== */

    let remainingSeconds = 25 * 60;

    let timerInterval = null;

    let timerRunning = false;

    let currentPeriod = "first";


    function formatTime(totalSeconds) {

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );
    }


    function updateTimerDisplay() {

      document.getElementById("timerDisplay").textContent =
        formatTime(remainingSeconds);

      updatePeriodDisplay();

      updateTeamSides();
    }


    function updatePeriodDisplay() {

      const display =
        document.getElementById("periodDisplay");


      if (currentPeriod === "first") {

        display.textContent = "前半";

      } else if (currentPeriod === "halftime") {

        display.textContent = "ハーフタイム";

      } else if (currentPeriod === "second") {

        display.textContent = "後半";

      } else if (currentPeriod === "finished") {

        display.textContent = "試合終了";
      }
    }


    function updateTeamSides() {

      const teams =
        document.getElementById("teams");


      if (currentPeriod === "second") {

        teams.classList.add("second-half");

      } else {

        teams.classList.remove("second-half");
      }
    }


    /* ==================================================
       設定値取得
       ================================================== */

    function getGameTime() {

      let minutes =
        Number(
          document.getElementById("minutesInput").value
        );

      let seconds =
        Number(
          document.getElementById("secondsInput").value
        );


      if (!Number.isFinite(minutes)) {
        minutes = 25;
      }

      if (!Number.isFinite(seconds)) {
        seconds = 0;
      }


      minutes =
        Math.max(
          0,
          Math.min(99, Math.floor(minutes))
        );


      seconds =
        Math.max(
          0,
          Math.min(59, Math.floor(seconds))
        );


      return minutes * 60 + seconds;
    }


    function getHalftimeTime() {

      let minutes =
        Number(
          document.getElementById("halftimeInput").value
        );


      if (!Number.isFinite(minutes)) {
        minutes = 10;
      }


      minutes =
        Math.max(
          0,
          Math.min(99, Math.floor(minutes))
        );


      return minutes * 60;
    }


    /* ==================================================
       設定を反映
       ================================================== */

    function applySettings() {

      /*
       * タイマー動作中は設定変更しない
       */

      if (timerRunning) {
        return;
      }


      const gameTime =
        getGameTime();

      const halftimeTime =
        getHalftimeTime();


      /*
       * 入力欄の値を正常な値に戻す
       */

      document.getElementById("minutesInput").value =
        Math.floor(gameTime / 60);

      document.getElementById("secondsInput").value =
        gameTime % 60;

      document.getElementById("halftimeInput").value =
        Math.floor(halftimeTime / 60);


      /*
       * 前半・後半
       */

      if (
        currentPeriod === "first" ||
        currentPeriod === "second"
      ) {

        remainingSeconds =
          gameTime;
      }


      /*
       * ハーフタイム
       */

      if (currentPeriod === "halftime") {

        remainingSeconds =
          halftimeTime;
      }


      updateTimerDisplay();
    }


    /* ==================================================
       START
       ================================================== */

    function startTimer() {

      if (timerRunning) {
        return;
      }


      if (currentPeriod === "finished") {
        return;
      }


      /*
       * 0秒のままSTARTされた場合
       * そのままでは進まないので何もしない
       */

      if (remainingSeconds <= 0) {
        return;
      }


      timerRunning = true;


      timerInterval =
        setInterval(() => {


          if (remainingSeconds > 0) {

            remainingSeconds--;

            updateTimerDisplay();

            return;
          }


          /*
           * タイマー停止
           */

          clearInterval(timerInterval);

          timerInterval = null;

          timerRunning = false;


          /*
           * 前半終了
           */

          if (currentPeriod === "first") {

            currentPeriod = "halftime";

            remainingSeconds =
              getHalftimeTime();

            updateTimerDisplay();

            return;
          }


          /*
           * ハーフタイム終了
           */

          if (currentPeriod === "halftime") {

            currentPeriod = "second";

            remainingSeconds =
              getGameTime();

            updateTimerDisplay();

            return;
          }


          /*
           * 後半終了
           */

          if (currentPeriod === "second") {

            currentPeriod = "finished";

            remainingSeconds = 0;

            updateTimerDisplay();

            return;
          }

        }, 1000);
    }


    /* ==================================================
       PAUSE
       ================================================== */

    function pauseTimer() {

      if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;
      }

      timerRunning = false;
    }


    /* ==================================================
       RESET
       ================================================== */

    function resetGame() {

      /*
       * タイマー停止
       */

      pauseTimer();


      /*
       * 点数を0に戻す
       */

      homeScore = 0;

      aweYScore = 0;


      /*
       * 前半に戻す
       */

      currentPeriod = "first";


      /*
       * 設定されている試合時間に戻す
       */

      remainingSeconds =
        getGameTime();


      updateScores();

      updateTimerDisplay();
    }


    /* ==================================================
       ボタンイベント
       ================================================== */

    document
      .getElementById("applySettingsButton")
      .addEventListener("click", applySettings);


    document
      .getElementById("startButton")
      .addEventListener("click", startTimer);


    document
      .getElementById("pauseButton")
      .addEventListener("click", pauseTimer);


    document
      .getElementById("resetButton")
      .addEventListener("click", resetGame);


    /* ==================================================
       初期表示
       ================================================== */

    updateScores();

    updateTimerDisplay();


    /* ==================================================
       PWA
       ================================================== */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {

            console.log(
              "Service Worker registration failed:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>

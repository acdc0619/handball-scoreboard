<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">

  <title>ハンドボール得点板</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    body {
      color: white;
    }

    /* =========================
       全体
       上60% / 中20% / 下20%
       ========================= */

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: 6fr 2fr 2fr;
    }

    /* =========================
       得点エリア
       ========================= */

    .teams {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
    }

    /* 後半は左右を入れ替える */
    .teams.second-half {
      flex-direction: row-reverse;
    }

    .team {
      flex: 1;
      width: 50%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      touch-action: manipulation;
      cursor: pointer;
    }

    .home {
      background: #064b91;
    }

    .aweY {
      background: #8b1111;
    }

    .team-name {
      font-size: clamp(24px, 5vw, 60px);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .score {
      font-size: clamp(100px, 20vw, 280px);
      line-height: 0.9;
      font-weight: bold;
    }

    /* =========================
       タイマーエリア
       ========================= */

    .timer-area {
      width: 100%;
      height: 100%;

      background: #181818;

      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;

      gap: clamp(20px, 4vw, 70px);
      padding: 10px 20px;
    }

    .timer-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      min-width: 0;
    }

    .period {
      font-size: clamp(18px, 2.5vw, 32px);
      font-weight: bold;
      text-align: center;
      margin-bottom: 5px;
    }

    .timer {
      font-size: clamp(45px, 8vw, 100px);
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    /* =========================
       時間設定
       ========================= */

    .settings {
      width: min(360px, 35vw);

      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .settings-title {
      text-align: center;
      font-size: clamp(14px, 1.8vw, 22px);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .setting-label {
      font-size: clamp(9px, 1.2vw, 14px);
      text-align: center;
      color: #ccc;
    }

    .time-input {
      width: 100%;
      min-width: 0;

      padding: 6px 4px;

      border: 1px solid #555;
      border-radius: 6px;

      background: #292929;
      color: white;

      font-size: clamp(14px, 1.7vw, 20px);
      text-align: center;
    }

    .settings-button {
      width: 100%;

      margin-top: 3px;
      padding: 7px 6px;

      border: none;
      border-radius: 7px;

      background: #555;
      color: white;

      font-size: clamp(12px, 1.5vw, 18px);
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;
    }

    .settings-button:active {
      transform: scale(0.97);
    }

    /* =========================
       START / PAUSE / RESET
       ========================= */

    .controls {
      width: 100%;
      height: 100%;

      background: #111;

      display: flex;
      flex-direction: row;

      justify-content: center;
      align-items: center;

      gap: clamp(10px, 2vw, 30px);

      padding: 10px 20px;
    }

    .control-button {
      width: min(250px, 25vw);

      padding: clamp(12px, 2vw, 22px) 8px;

      border: none;
      border-radius: 10px;

      background: #333;
      color: white;

      font-size: clamp(18px, 2.5vw, 32px);
      font-weight: bold;

      cursor: pointer;
      touch-action: manipulation;
    }

    .control-button:active {
      transform: scale(0.96);
    }

    /* =========================
       スマートフォン縦向き
       ========================= */

    @media (orientation: portrait) {

      .app {
        grid-template-rows: 6fr 2fr 2fr;
      }

      .team-name {
        font-size: clamp(18px, 7vw, 38px);
      }

      .score {
        font-size: clamp(70px, 28vw, 180px);
      }

      .timer-area {
        flex-direction: row;
        gap: 10px;
        padding: 5px 8px;
      }

      .timer-main {
        flex: 1;
      }

      .period {
        font-size: clamp(14px, 4vw, 24px);
      }

      .timer {
        font-size: clamp(32px, 9vw, 65px);
      }

      .settings {
        width: min(45%, 220px);
      }

      .settings-title {
        font-size: clamp(11px, 3vw, 16px);
      }

      .setting-label {
        font-size: clamp(8px, 2vw, 11px);
      }

      .time-input {
        font-size: clamp(12px, 3vw, 16px);
        padding: 4px 2px;
      }

      .settings-button {
        font-size: clamp(10px, 2.5vw, 14px);
        padding: 5px 2px;
      }

      .controls {
        gap: 6px;
        padding: 5px;
      }

      .control-button {
        width: 29%;
        padding: 12px 3px;
        font-size: clamp(14px, 4vw, 20px);
      }
    }

    /* =========================
       かなり小さい画面
       ========================= */

    @media (max-width: 500px) and (orientation: portrait) {

      .timer-area {
        gap: 5px;
      }

      .settings {
        width: 48%;
      }

      .timer-main {
        width: 48%;
      }

      .control-button {
        width: 30%;
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         上60%：得点
         ========================= -->

    <div class="teams" id="teams">

      <div
        class="team home"
        id="homeTeam"
      >
        <div class="team-name">HOME</div>
        <div class="score" id="homeScore">0</div>
      </div>

      <div
        class="team aweY"
        id="aweYTeam"
      >
        <div class="team-name">AWEY</div>
        <div class="score" id="aweYScore">0</div>
      </div>

    </div>


    <!-- =========================
         中20%：タイマー
         ========================= -->

    <div class="timer-area">

      <div class="timer-main">

        <div
          class="period"
          id="periodDisplay"
        >
          前半
        </div>

        <div
          class="timer"
          id="timerDisplay"
        >
          25:00
        </div>

      </div>


      <!-- 時間設定 -->

      <div class="settings">

        <div class="settings-title">
          時間設定
        </div>

        <div class="setting-row">

          <div class="setting-label">
            試合 分
          </div>

          <div class="setting-label">
            試合 秒
          </div>

        </div>

        <div class="setting-row">

          <input
            id="minutesInput"
            class="time-input"
            type="number"
            min="0"
            max="99"
            value="25"
          >

          <input
            id="secondsInput"
            class="time-input"
            type="number"
            min="0"
            max="59"
            value="0"
          >

        </div>

        <div class="setting-row">

          <div class="setting-label">
            ハーフタイム 分
          </div>

          <div></div>

        </div>

        <div class="setting-row">

          <input
            id="halftimeInput"
            class="time-input"
            type="number"
            min="0"
            max="99"
            value="10"
          >

          <div></div>

        </div>

        <button
          class="settings-button"
          id="applySettingsButton"
        >
          設定を反映
        </button>

      </div>

    </div>


    <!-- =========================
         下20%：操作ボタン
         ========================= -->

    <div class="controls">

      <button
        class="control-button"
        id="startButton"
      >
        START
      </button>

      <button
        class="control-button"
        id="pauseButton"
      >
        PAUSE
      </button>

      <button
        class="control-button"
        id="resetButton"
      >
        RESET
      </button>

    </div>

  </div>


  <script>

    /* =========================
       スコア
       ========================= */

    let homeScore = 0;
    let aweYScore = 0;

    let homeTapTimer = null;
    let aweYTapTimer = null;

    const DOUBLE_TAP_DELAY = 250;


    function updateScores() {

      document.getElementById("homeScore").textContent =
        homeScore;

      document.getElementById("aweYScore").textContent =
        aweYScore;
    }


    /*
      1回タップ
      → 250ms待って +1

      2回タップ
      → +1をキャンセルして -1
    */

    function handleScoreTap(team) {

      /* HOME */

      if (team === "home") {

        if (homeTapTimer !== null) {

          clearTimeout(homeTapTimer);

          homeTapTimer = null;

          if (homeScore > 0) {
            homeScore--;
          }

          updateScores();

          return;
        }


        homeTapTimer = setTimeout(() => {

          homeScore++;

          updateScores();

          homeTapTimer = null;

        }, DOUBLE_TAP_DELAY);

        return;
      }


      /* AWEY */

      if (team === "aweY") {

        if (aweYTapTimer !== null) {

          clearTimeout(aweYTapTimer);

          aweYTapTimer = null;

          if (aweYScore > 0) {
            aweYScore--;
          }

          updateScores();

          return;
        }


        aweYTapTimer = setTimeout(() => {

          aweYScore++;

          updateScores();

          aweYTapTimer = null;

        }, DOUBLE_TAP_DELAY);

        return;
      }

    }


    /* =========================
       得点エリアのタップ
       ========================= */

    document
      .getElementById("homeTeam")
      .addEventListener("pointerup", function(event) {

        event.preventDefault();

        handleScoreTap("home");

      });


    document
      .getElementById("aweYTeam")
      .addEventListener("pointerup", function(event) {

        event.preventDefault();

        handleScoreTap("aweY");

      });


    /* =========================
       タイマー
       ========================= */

    let remainingSeconds = 25 * 60;

    let timerInterval = null;

    let timerRunning = false;

    let currentPeriod = "first";


    function formatTime(totalSeconds) {

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
      );

    }


    function updateTimerDisplay() {

      document.getElementById("timerDisplay").textContent =
        formatTime(remainingSeconds);

      updatePeriodDisplay();

      updateTeamSides();

    }


    /* =========================
       前半 / ハーフタイム / 後半
       ========================= */

    function updatePeriodDisplay() {

      const display =
        document.getElementById("periodDisplay");


      if (currentPeriod === "first") {

        display.textContent = "前半";

      }
      else if (currentPeriod === "halftime") {

        display.textContent = "ハーフタイム";

      }
      else if (currentPeriod === "second") {

        display.textContent = "後半";

      }
      else if (currentPeriod === "finished") {

        display.textContent = "試合終了";

      }

    }


    /* =========================
       後半の左右入れ替え
       ========================= */

    function updateTeamSides() {

      const teams =
        document.getElementById("teams");


      if (currentPeriod === "second") {

        teams.classList.add("second-half");

      }
      else {

        teams.classList.remove("second-half");

      }

    }


    /* =========================
       試合時間取得
       ========================= */

    function getGameTime() {

      let minutes =
        Number(
          document.getElementById("minutesInput").value
        );

      let seconds =
        Number(
          document.getElementById("secondsInput").value
        );


      if (!Number.isFinite(minutes)) {
        minutes = 25;
      }

      if (!Number.isFinite(seconds)) {
        seconds = 0;
      }


      minutes =
        Math.max(
          0,
          Math.min(
            99,
            Math.floor(minutes)
          )
        );


      seconds =
        Math.max(
          0,
          Math.min(
            59,
            Math.floor(seconds)
          )
        );


      return minutes * 60 + seconds;

    }


    /* =========================
       ハーフタイム時間取得
       ========================= */

    function getHalftimeTime() {

      let minutes =
        Number(
          document.getElementById("halftimeInput").value
        );


      if (!Number.isFinite(minutes)) {
        minutes = 10;
      }


      minutes =
        Math.max(
          0,
          Math.min(
            99,
            Math.floor(minutes)
          )
        );


      return minutes * 60;

    }


    /* =========================
       設定を反映
       ========================= */

    function applySettings() {

      /*
        試合中は設定変更しない
      */

      if (timerRunning) {
        return;
      }


      const gameTime =
        getGameTime();


      const halftimeTime =
        getHalftimeTime();


      /*
        入力欄の値を正常化
      */

      document.getElementById("minutesInput").value =
        Math.floor(gameTime / 60);


      document.getElementById("secondsInput").value =
        gameTime % 60;


      document.getElementById("halftimeInput").value =
        Math.floor(halftimeTime / 60);


      /*
        前半・後半なら試合時間を反映
      */

      if (
        currentPeriod === "first" ||
        currentPeriod === "second"
      ) {

        remainingSeconds =
          gameTime;

      }


      /*
        ハーフタイムなら
        ハーフタイム時間を反映
      */

      if (currentPeriod === "halftime") {

        remainingSeconds =
          halftimeTime;

      }


      updateTimerDisplay();

    }


    /* =========================
       タイマー開始
       ========================= */

function startTimer() {

  if (timerRunning) {
    return;
  }

  if (currentPeriod === "finished") {
    return;
  }

  if (remainingSeconds <= 0) {
    return;
  }

  timerRunning = true;

  timerInterval =
    setInterval(() => {

      if (remainingSeconds > 0) {

        remainingSeconds--;

        updateTimerDisplay();

        /*
          タイマーが0になったら
          次の状態へ移行
        */

        if (remainingSeconds === 0) {

          clearInterval(timerInterval);

          timerInterval = null;

          timerRunning = false;


          /* =========================
             前半終了
             → ハーフタイムへ
             → そのまま自動スタート
             ========================= */

          if (currentPeriod === "first") {

            currentPeriod = "halftime";

            remainingSeconds =
              getHalftimeTime();

            updateTimerDisplay();

            /*
              ハーフタイムを
              自動で続けてカウントダウン
            */

            timerRunning = true;

            timerInterval =
              setInterval(() => {

                if (remainingSeconds > 0) {

                  remainingSeconds--;

                  updateTimerDisplay();

                  return;
                }


                /*
                  ハーフタイム終了
                  → 後半へ
                  → ここでは停止
                */

                clearInterval(timerInterval);

                timerInterval = null;

                timerRunning = false;

                currentPeriod = "second";

                remainingSeconds =
                  getGameTime();

                updateTimerDisplay();

              }, 1000);

            return;
          }


          /* =========================
             後半終了
             → 試合終了
             ========================= */

          if (currentPeriod === "second") {

            currentPeriod = "finished";

            remainingSeconds = 0;

            updateTimerDisplay();

            return;
          }

        }

      }

    }, 1000);

}


    /* =========================
       PAUSE
       ========================= */

    function pauseTimer() {

      if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

      }

      timerRunning = false;

    }


    /* =========================
       RESET
       ========================= */

    function resetGame() {

      pauseTimer();


      /*
        スコアを0に戻す
      */

      homeScore = 0;

      aweYScore = 0;


      /*
        前半に戻す
      */

      currentPeriod = "first";


      /*
        設定されている試合時間に戻す
      */

      remainingSeconds =
        getGameTime();


      updateScores();

      updateTimerDisplay();

    }


    /* =========================
       ボタン
       ========================= */

    document
      .getElementById("applySettingsButton")
      .addEventListener(
        "click",
        applySettings
      );


    document
      .getElementById("startButton")
      .addEventListener(
        "click",
        startTimer
      );


    document
      .getElementById("pauseButton")
      .addEventListener(
        "click",
        pauseTimer
      );


    document
      .getElementById("resetButton")
      .addEventListener(
        "click",
        resetGame
      );


    /* =========================
       初期表示
       ========================= */

    updateScores();

    updateTimerDisplay();


    /* =========================
       Service Worker
       ========================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {

            console.log(
              "Service Worker registration failed:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>

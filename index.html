<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ハンドボール得点板">

  <link rel="manifest" href="manifest.json">

  <title>ハンドボール得点板</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    body {
      color: white;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 60% 20% 20%;
      padding: 8px;
      gap: 8px;
    }

    /* =========================
       得点エリア
    ========================= */

    .teams {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .team {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      user-select: none;
      cursor: pointer;
    }

    .home {
      background: #064b91;
    }

    .away {
      background: #8b1111;
    }

    .team-name {
      font-size: clamp(24px, 5vw, 50px);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .score {
      font-size: clamp(70px, 18vw, 180px);
      line-height: 1;
      font-weight: bold;
    }

    /* =========================
       後半は左右を反転
    ========================= */

    .teams.second-half {
      direction: rtl;
    }

    .teams.second-half .team {
      direction: ltr;
    }

    /* =========================
       タイマーエリア
    ========================= */

    .timer-area {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 8px;
    }

    .timer-box {
      min-width: 0;
      min-height: 0;
      background: #222;
      border-radius: 12px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .period {
      font-size: clamp(20px, 4vw, 36px);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .timer {
      font-size: clamp(50px, 11vw, 110px);
      line-height: 1;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .settings {
      min-width: 0;
      min-height: 0;
      background: #222;
      border-radius: 12px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 8px;
    }

    .settings-title {
      font-size: 14px;
      font-weight: bold;
    }

    .time-input {
      width: 100%;
      height: 34px;
      border: none;
      border-radius: 6px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .time-label {
      font-size: 11px;
    }

    /* =========================
       操作ボタン
    ========================= */

    .controls {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .control-button {
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: clamp(18px, 4vw, 36px);
      font-weight: bold;
      cursor: pointer;
    }

    .control-button:active {
      background: #555;
    }

    /* =========================
       横画面
    ========================= */

    @media (orientation: landscape) {

      .timer-area {
        grid-template-columns: minmax(0, 1fr) 135px;
      }

      .team-name {
        font-size: clamp(20px, 4vw, 40px);
      }

      .score {
        font-size: clamp(60px, 17vw, 170px);
      }

      .period {
        font-size: clamp(18px, 3vw, 30px);
      }

      .timer {
        font-size: clamp(45px, 9vw, 100px);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         得点
    ========================= -->

    <div class="teams" id="teams">

      <div
        class="team home"
        onclick="scoreTap('home')"
      >
        <div class="team-name">HOME</div>
        <div class="score" id="homeScore">0</div>
      </div>

      <div
        class="team away"
        onclick="scoreTap('away')"
      >
        <div class="team-name">AWEY</div>
        <div class="score" id="awayScore">0</div>
      </div>

    </div>


    <!-- =========================
         タイマー
    ========================= -->

    <div class="timer-area">

      <div class="timer-box">

        <div class="period" id="period">
          前半
        </div>

        <div class="timer" id="timer">
          25:00
        </div>

      </div>


      <div class="settings">

        <div class="settings-title">
          時間設定
        </div>

        <div class="time-label">
          分
        </div>

        <input
          id="minutesInput"
          class="time-input"
          type="number"
          min="0"
          max="99"
          value="25"
        >

        <div class="time-label">
          秒
        </div>

        <input
          id="secondsInput"
          class="time-input"
          type="number"
          min="0"
          max="59"
          value="0"
        >

        <div class="time-label">
          ハーフタイム
        </div>

        <input
          id="halftimeInput"
          class="time-input"
          type="number"
          min="0"
          max="99"
          value="10"
        >

      </div>

    </div>


    <!-- =========================
         操作
    ========================= -->

    <div class="controls">

      <button
        class="control-button"
        onclick="startTimer()"
      >
        START
      </button>

      <button
        class="control-button"
        onclick="pauseTimer()"
      >
        PAUSE
      </button>

      <button
        class="control-button"
        onclick="resetTimer()"
      >
        RESET
      </button>

    </div>

  </div>


  <script>

    /* =========================
       得点処理
    ========================= */

    let scores = {
      home: 0,
      away: 0
    };

    let lastTap = {
      home: 0,
      away: 0
    };


    function scoreTap(team) {

      const now = Date.now();

      if (now - lastTap[team] < 300) {

        scores[team] = Math.max(
          0,
          scores[team] - 1
        );

      } else {

        scores[team]++;

      }

      lastTap[team] = now;

      document.getElementById(
        team + 'Score'
      ).textContent = scores[team];
    }


    /* =========================
       タイマー
    ========================= */

    let timerInterval = null;

    let currentPeriod = 'first';

    let remainingSeconds = 25 * 60;


    function formatTime(totalSeconds) {

      const minutes =
        Math.floor(totalSeconds / 60);

      const seconds =
        totalSeconds % 60;

      return (
        String(minutes).padStart(2, '0')
        + ':'
        + String(seconds).padStart(2, '0')
      );
    }


    /* =========================
       前半・後半の左右変更
    ========================= */

    function updateTeamSides() {

      const teams =
        document.getElementById('teams');

      if (currentPeriod === 'second') {

        teams.classList.add('second-half');

      } else {

        teams.classList.remove('second-half');

      }
    }


    function updateTimerDisplay() {

      document.getElementById(
        'timer'
      ).textContent =
        formatTime(remainingSeconds);


      const periodText = {
        first: '前半',
        halftime: 'ハーフタイム',
        second: '後半',
        finished: '試合終了'
      };


      document.getElementById(
        'period'
      ).textContent =
        periodText[currentPeriod];


      updateTeamSides();
    }


    /* =========================
       試合時間取得
    ========================= */

    function getMainTime() {

      let minutes = Number(
        document.getElementById(
          'minutesInput'
        ).value
      );

      let seconds = Number(
        document.getElementById(
          'secondsInput'
        ).value
      );


      if (!Number.isFinite(minutes)) {
        minutes = 25;
      }

      if (!Number.isFinite(seconds)) {
        seconds = 0;
      }


      minutes = Math.max(
        0,
        Math.min(
          99,
          Math.floor(minutes)
        )
      );


      seconds = Math.max(
        0,
        Math.min(
          59,
          Math.floor(seconds)
        )
      );


      return minutes * 60 + seconds;
    }


    /* =========================
       ハーフタイム時間取得
    ========================= */

    function getHalftimeTime() {

      let minutes = Number(
        document.getElementById(
          'halftimeInput'
        ).value
      );


      if (!Number.isFinite(minutes)) {
        minutes = 10;
      }


      minutes = Math.max(
        0,
        Math.min(
          99,
          Math.floor(minutes)
        )
      );


      return minutes * 60;
    }


    /* =========================
       START
    ========================= */

    function startTimer() {

      if (timerInterval !== null) {
        return;
      }


      if (currentPeriod === 'finished') {
        return;
      }


      timerInterval = setInterval(
        timerTick,
        1000
      );
    }


    /* =========================
       PAUSE
    ========================= */

    function pauseTimer() {

      if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;
      }
    }


    /* =========================
       タイマー処理
    ========================= */

    function timerTick() {

      if (remainingSeconds > 0) {

        remainingSeconds--;

        updateTimerDisplay();

        return;
      }


      /* =========================
         前半終了
      ========================= */

      if (currentPeriod === 'first') {

        pauseTimer();

        currentPeriod = 'halftime';

        remainingSeconds =
          getHalftimeTime();

        updateTimerDisplay();

        return;
      }


      /* =========================
         ハーフタイム終了
      ========================= */

      if (currentPeriod === 'halftime') {

        pauseTimer();

        currentPeriod = 'second';

        remainingSeconds =
          getMainTime();

        updateTimerDisplay();

        return;
      }


      /* =========================
         後半終了
      ========================= */

      if (currentPeriod === 'second') {

        pauseTimer();

        currentPeriod = 'finished';

        remainingSeconds = 0;

        updateTimerDisplay();

        return;
      }
    }


    /* =========================
       RESET
    ========================= */

    function resetTimer() {

      pauseTimer();

      currentPeriod = 'first';

      remainingSeconds =
        getMainTime();

      updateTimerDisplay();
    }


    /* =========================
       初期表示
    ========================= */

    updateTimerDisplay();


    /* =========================
       Service Worker
    ========================= */

    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        function() {

          navigator.serviceWorker.register(
            'sw.js'
          ).catch(function(error) {

            console.log(
              'Service Worker registration failed:',
              error
            );

          });

        }
      );

    }

  </script>

</body>
</html>
